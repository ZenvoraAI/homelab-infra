services:
  nginx:
    image: nginx:1.27-alpine
    container_name: homelab-nginx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/homelab-acme:/var/www/certbot:ro
    mem_limit: 64m
  api:
    image: ghcr.io/qclawchang/family-media-api:latest
    container_name: homelab-family-api
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/family-media/api/.env:/app/.env:ro
    mem_limit: 640m
  securevault-api:
    image: ghcr.io/qclawchang/securevault-api:latest
    container_name: homelab-securevault-api
    network_mode: host
    restart: unless-stopped
    environment:
      - NODE_ENV
      - PORT
      - JWT_SECRET
      - TOTP_ENCRYPTION_KEY
      - INHERITANCE_HINT_SECRET
      - ALLOWED_ORIGINS
      - DATABASE_URL
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_REDIRECT_URI
      - FRONTEND_URL
      - CAPTCHA_PROVIDER
      - CAPTCHA_SECRET
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASS
      - EMAIL_FROM
      - PASSWORD_RESET_PATH
    mem_limit: 256m
  dayandyou-staging:
    image: ghcr.io/qclawchang/dayandyou:staging
    container_name: homelab-dayandyou-staging
    network_mode: host
    restart: unless-stopped
    environment:
      - NODE_ENV
      - PORT
      - DATABASE_URL
      - DIRECT_URL
      - NEXTAUTH_SECRET
      - NEXTAUTH_URL
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - AWS_S3_BUCKET
      - ASSET_BASE_URL
      - NEXT_PUBLIC_ASSET_BASE_URL
      - AWS_SES_REGION
      - AWS_SES_ACCESS_KEY_ID
      - AWS_SES_SECRET_ACCESS_KEY
      - AWS_SES_FROM
      - ADMIN_EMAIL
      - NEXT_PUBLIC_APP_URL
      - SITE_MODE
    mem_limit: 350m
  dayandyou-prod:
    image: ghcr.io/qclawchang/dayandyou:release
    container_name: homelab-dayandyou-prod
    network_mode: host
    restart: unless-stopped
    environment:
      - NODE_ENV
      - PORT
      - DATABASE_URL
      - DIRECT_URL
      - NEXTAUTH_SECRET
      - NEXTAUTH_URL
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - AWS_S3_BUCKET
      - ASSET_BASE_URL
      - NEXT_PUBLIC_ASSET_BASE_URL
      - AWS_SES_REGION
      - AWS_SES_ACCESS_KEY_ID
      - AWS_SES_SECRET_ACCESS_KEY
      - AWS_SES_FROM
      - ADMIN_EMAIL
      - NEXT_PUBLIC_APP_URL
      - SITE_MODE
    mem_limit: 400m
