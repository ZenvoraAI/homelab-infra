# Docker's json-file driver has no size limit by default, so every container
# here would grow its log without bound until the disk filled. That is not
# hypothetical on this host: the disk did fill on 2026-08-12 -- from image
# accumulation, which scripts/docker-prune.sh now handles -- and unbounded logs
# are the same failure by a different route. A full disk takes down every site
# at once, because they all share one box.
#
# 10m x 3 files is 30 MB per container, ~210 MB in total against a 58 GB disk.
# Logs measured under 1 MB per container on 2026-08-13, so this is a ceiling
# rather than a change to anything.
#
# Applies to a container when it is next recreated, which every deploy does.
# /etc/docker/daemon.json carries the same defaults as a safety net for
# anything started outside this file; an explicit setting here wins over that
# default, and they agree anyway.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The application repositories moved from the qclawchang personal account to
# the ZenvoraAI organization on 2026-08-15, so the images they build now land
# under a different GHCR namespace. GHCR packages do not follow a repository
# transfer -- the old ghcr.io/qclawchang/* packages still exist but nothing
# pushes to them any more, so pinning to them would pull a frozen image for
# ever without any error to notice.
#
# The organisation is spelled ZenvoraAI, but this says zenvoraai: a Docker
# image reference must be lower case or the client rejects it outright with
# "repository name must be lowercase" -- it never reaches the registry. That
# is also why the workflows that build these images spell it out rather than
# using ${{ github.repository_owner }}, which returns the capitalised form.
# GHCR_OWNER exists only so this host can be pointed elsewhere without an
# edit; the default is the answer in every case today.
services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949}
    container_name: homelab-nginx
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/homelab-acme:/var/www/certbot:ro
    mem_limit: 64m
  api:
    image: ghcr.io/${GHCR_OWNER:-zenvoraai}/family-media-api:${FAMILY_API_TAG:-latest}
    container_name: homelab-family-api
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /opt/secrets/family-media/.env:/app/.env:ro
    mem_limit: 640m
  securevault-api:
    image: ghcr.io/${GHCR_OWNER:-zenvoraai}/securevault-api:${SECUREVAULT_API_TAG:-latest}
    container_name: homelab-securevault-api
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV
      - PORT
      # The API sits behind this repository's nginx, so express must trust one
      # proxy hop to see the real client IP. Without it every client collapses
      # into 127.0.0.1 and every one of SecureVault's rate limiters buckets all
      # users together -- five contact submissions from one attacker then lock
      # the contact form and password reset for everybody.
      # SecureVault's deploy workflow has always exported TRUST_PROXY=1; it was
      # simply never declared here, so it never reached the container. Found
      # 2026-08-13 by comparing the workflow's exports against this list.
      - TRUST_PROXY
      - JWT_SECRET
      - INHERITANCE_HINT_SECRET
      # WebAuthn relying party. The API exits at startup without both
      # (services/webauthn/rpConfig.js) — a credential minted under the wrong
      # RP ID is permanently unusable, so refusing to boot is deliberate.
      # Declared here for the same reason TRUST_PROXY above had to be: the
      # deploy workflow exports them, but compose only forwards names on this
      # list, so an export alone never reaches the container.
      - WEBAUTHN_RP_ID
      - WEBAUTHN_ORIGINS
      - ALLOWED_ORIGINS
      - DATABASE_URL
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_REDIRECT_URI
      - FRONTEND_URL
      - CAPTCHA_PROVIDER
      - CAPTCHA_SECRET
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASS
      - EMAIL_FROM
      - PASSWORD_RESET_PATH
    mem_limit: 256m
  dayandyou-staging:
    image: ghcr.io/${GHCR_OWNER:-zenvoraai}/dayandyou:${DAYANDYOU_STAGING_TAG:-staging}
    container_name: homelab-dayandyou-staging
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV
      - PORT
      - DATABASE_URL
      - DIRECT_URL
      - NEXTAUTH_SECRET
      - NEXTAUTH_URL
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - AWS_S3_BUCKET
      - ASSET_BASE_URL
      - NEXT_PUBLIC_ASSET_BASE_URL
      - AWS_SES_REGION
      - AWS_SES_ACCESS_KEY_ID
      - AWS_SES_SECRET_ACCESS_KEY
      - AWS_SES_FROM
      - ADMIN_EMAIL
      - NEXT_PUBLIC_APP_URL
      - SITE_MODE
      # Staging-only HTTP Basic shield. Absent from dayandyou-prod on
      # purpose: the app treats an unset value as "no gate".
      - SITE_PASSWORD
      # Enables the FORCED-sweep endpoint POST /api/internal/sweep-
      # reservations only. Expired stock reservations are already reclaimed
      # by an in-process timer every 5 minutes (instrumentation-node.ts),
      # so this is an ops convenience, not a dependency.
      - CRON_SECRET
    mem_limit: 350m
  dayandyou-prod:
    image: ghcr.io/${GHCR_OWNER:-zenvoraai}/dayandyou:${DAYANDYOU_PROD_TAG:-release}
    container_name: homelab-dayandyou-prod
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV
      - PORT
      - DATABASE_URL
      - DIRECT_URL
      - NEXTAUTH_SECRET
      - NEXTAUTH_URL
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - AWS_S3_BUCKET
      - ASSET_BASE_URL
      - NEXT_PUBLIC_ASSET_BASE_URL
      - AWS_SES_REGION
      - AWS_SES_ACCESS_KEY_ID
      - AWS_SES_SECRET_ACCESS_KEY
      - AWS_SES_FROM
      - ADMIN_EMAIL
      - NEXT_PUBLIC_APP_URL
      - SITE_MODE
      # Enables the FORCED-sweep endpoint POST /api/internal/sweep-
      # reservations only. Expired stock reservations are already reclaimed
      # by an in-process timer every 5 minutes (instrumentation-node.ts),
      # so this is an ops convenience, not a dependency.
      - CRON_SECRET
    mem_limit: 400m
  memorial-api:
    image: ghcr.io/${GHCR_OWNER:-zenvoraai}/aiqiuqi-memorial-api:${MEMORIAL_API_TAG:-latest}
    container_name: homelab-memorial-api
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - /opt/secrets/aiqiuqi-memorial/api.env
    mem_limit: 192m
  memorial-worker:
    image: ghcr.io/${GHCR_OWNER:-zenvoraai}/aiqiuqi-memorial-worker:${MEMORIAL_WORKER_TAG:-latest}
    container_name: homelab-memorial-worker
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - /opt/secrets/aiqiuqi-memorial/worker.env
    mem_limit: 512m
  # CONTAINERS=1 permits the whole /containers/* GET surface in this proxy image
  # (list/inspect, but also logs/top/export/archive across all containers on
  # the host) -- there is no finer-grained flag in tecnativa/docker-socket-proxy.
  # inspect returns every container's Config.Env (every secret passed via
  # environment:/env_file:), and archive reads any file inside any container
  # (e.g. family-media's mounted .env), so this proxy alone would hand every
  # secret on the host to whoever compromised zenvora-admin.
  #
  # zenvora-admin calls exactly one endpoint, GET /containers/json?all=true
  # (zenvora-admin src/deployment/dockerProxy.ts). So zenvora-admin no longer
  # shares a network with this proxy: it sits alone with docker-api-filter on
  # the internal docker-socket-net, and docker-api-filter (below) forwards only
  # that one request.
  #
  # Not published to the host (no `ports:`), so it is not on 127.0.0.1. That
  # is NOT the same as unreachable from the host-network services: they share
  # the host's network namespace, and on Linux the host can usually connect
  # to a bridge container's own IP directly (host -> container goes through
  # OUTPUT, not FORWARD, so Docker's isolation and `internal:` rules do not
  # apply). A compromised host-network container could then call this proxy's
  # full CONTAINERS=1 surface at <container IP>:2375, bypassing the filter.
  # That was equally true before the filter existed. Verify on the host with
  # the probe in README "docker API allow-list"; the candidate mitigations are
  # listed there, none applied yet.
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.3@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2}
    container_name: homelab-docker-socket-proxy
    restart: unless-stopped
    logging: *default-logging
    environment:
      - CONTAINERS=1
      - POST=0
      - EXEC=0
      - BUILD=0
      - COMMIT=0
      - ATTACH=0
      - IMAGES=0
      - INFO=0
      - NETWORKS=0
      - VOLUMES=0
    networks:
      docker-socket-net:
        # The filter's upstream name. Distinct from the service name because
        # docker-api-filter answers to "docker-socket-proxy" on
        # docker-proxy-net; reusing that name here would make the filter
        # resolve itself.
        aliases:
          - docker-socket-upstream
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 16m
  # Allow-list in front of docker-socket-proxy: forwards GET /containers/json
  # and returns 403 for everything else (nginx/docker-api-filter/nginx.conf).
  # Same image as the public nginx, so no new image to trust or pull.
  #
  # It answers to "docker-socket-proxy" on docker-proxy-net, so zenvora-admin's
  # existing DOCKER_PROXY_URL=http://docker-socket-proxy:2375 now lands here
  # with no host-side env edit. All three services must be recreated together
  # (see README "docker API allow-list"): while an old docker-socket-proxy
  # container is still attached to docker-proxy-net, that name resolves to
  # both.
  docker-api-filter:
    image: ${NGINX_IMAGE:-nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949}
    container_name: homelab-docker-api-filter
    restart: unless-stopped
    logging: *default-logging
    networks:
      docker-proxy-net:
        aliases:
          - docker-socket-proxy
      docker-socket-net: {}
    volumes:
      - ./nginx/docker-api-filter/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - docker-socket-proxy
    # Goes through the filter to the raw proxy: nginx answers 502 when the
    # upstream is unreachable, and busybox wget exits non-zero on that (and on
    # a 403 from a broken allow-list). zenvora-admin waits on this, so a broken
    # filter fails `docker compose up` loudly -- zenvora-admin's own /healthz
    # does not cover docker access and would report a broken filter healthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/containers/json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 16m
  zenvora-admin:
    image: ghcr.io/${GHCR_OWNER:-zenvoraai}/zenvora-admin:${ZENVORA_ADMIN_TAG:-latest}
    container_name: homelab-zenvora-admin
    # Not network_mode: host, unlike every other app here -- this is the one
    # service that talks to docker-socket-proxy, and that proxy must not be
    # reachable from the other host-network containers (see the comment on
    # docker-socket-proxy above). Joins the private docker-proxy-net bridge to
    # reach it, plus a loopback-only port publish below so nginx (still
    # host-network) can still reach this container exactly as before.
    networks:
      - docker-proxy-net
    ports:
      - "127.0.0.1:3100:3100"
    # This move off host networking also cut the *other* direction this
    # service needs: its own origin/certificate probe of nginx, which still
    # binds 127.0.0.1 (see NGINX_ORIGIN_HOST below) -- a loopback address
    # that, from inside this bridge network, no longer refers to the host.
    # nginx's vhosts listen on bare `listen 80;`/`listen 443 ssl;` (all
    # interfaces, required for Cloudflare to reach them), so the host's real
    # address works; host.docker.internal is Compose's portable name for it
    # rather than hardcoding docker-proxy-net's gateway IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      docker-api-filter:
        condition: service_healthy
    # No environment: block at all — everything, including the non-secret
    # PORT, lives in env_file, matching the memorial-api/memorial-worker
    # pattern above. A bare `environment: - PORT` passthrough would resolve
    # from the shell/project .env at `docker compose up` time (not from this
    # service's own env_file) and, critically, Compose's environment: always
    # wins over env_file: for the same key — if PORT weren't also exported at
    # the shell level, that bare passthrough would silently blank it to an
    # empty string rather than falling back to whatever env_file set, which
    # would make Bun try to listen on port 0. One file, one source of truth.
    #
    # Two values in that env_file must be updated on the host, by hand:
    # DOCKER_PROXY_URL from http://127.0.0.1:2375 to
    # http://docker-socket-proxy:2375 -- Compose's embedded DNS resolves that
    # name on docker-proxy-net (since the docker API allow-list it is
    # docker-api-filter's alias there, with no further env edit) -- and
    # NGINX_ORIGIN_HOST from 127.0.0.1 to
    # host.docker.internal, per the extra_hosts comment above. This repo
    # change alone does nothing until both host-side edits and a
    # `docker compose up -d --force-recreate docker-socket-proxy docker-api-filter zenvora-admin`
    # all happen.
    env_file:
      - /opt/secrets/zenvora-admin/.env
    volumes:
      - /opt/data/zenvora-admin:/app/data
    mem_limit: 128m

networks:
  docker-proxy-net:
    driver: bridge
  # Only docker-socket-proxy and docker-api-filter. internal: no route out,
  # and nothing that faces the internet is attached.
  docker-socket-net:
    driver: bridge
    internal: true
