user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;

    # Rate limit for endpoints that send email without requiring a login.
    # Those are usable as a free mail relay: a script POSTing a password-reset
    # or contact form with arbitrary addresses makes SES send on our behalf,
    # which burns the daily quota, spikes bounce and complaint rates, and gets
    # account sending suspended. The suspension is the real damage -- domain
    # reputation takes weeks to recover, if it recovers.
    #
    # 5r/m with burst=3 is generous for a human retrying a form and hostile to
    # a loop. $binary_remote_addr is the true client address here: these hosts
    # are served directly by this nginx, not through CloudFront.
    limit_req_zone $binary_remote_addr zone=email_ep:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}
