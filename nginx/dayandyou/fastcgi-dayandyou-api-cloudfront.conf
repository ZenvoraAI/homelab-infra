# FastCGI to the Day and You API's PHP-FPM, for the CloudFront origin vhosts
# (conf.d/dayandyou-api-origin.conf). A copy of the API repo's
# docker/nginx/fastcgi-dayandyou-api.conf with exactly three differences, each
# marked "CloudFront:" below. The location sets $dayandyou_api_fpm first.
#
# nginx serves no file from disk: every request runs public/index.php inside the FPM container,
# so nothing else (dotfiles, vendor/, storage/, .env, a stray .php) can execute or be downloaded.
fastcgi_pass $dayandyou_api_fpm;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
fastcgi_param DOCUMENT_URI /index.php;
# The client address for every rate-limit key (App\Support\ClientIp): a FastCGI param without
# the HTTP_ prefix, so no request header can set it. No X-Forwarded-For is passed and the app
# trusts none.
# CloudFront: the viewer CloudFront reported, not $remote_addr (a shared CloudFront edge). The
# vhost refuses any request without the origin secret or a viewer address before this runs.
fastcgi_param DAY_CLIENT_IP $dayandyou_viewer_ip;
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_param HTTP_X_REAL_IP "";
# CloudFront: PHP never sees (or logs) the origin secret.
fastcgi_param HTTP_X_DAYANDYOU_ORIGIN_SECRET "";
# CloudFront: the API reads only DAY_CLIENT_IP.
fastcgi_param HTTP_CLOUDFRONT_VIEWER_ADDRESS "";
# TLS terminates in this nginx.
fastcgi_param HTTPS $https if_not_empty;
# httpoxy: a client "Proxy:" header must never become HTTP_PROXY inside PHP.
fastcgi_param HTTP_PROXY "";

# Above FPM's request_terminate_timeout (main 60 s, payments 30 s; docker/php-fpm.conf), so FPM
# ends a stuck request and the client gets the app's JSON error, not an nginx 504.
fastcgi_read_timeout 70s;
fastcgi_send_timeout 70s;
fastcgi_connect_timeout 5s;

fastcgi_hide_header X-Powered-By;
