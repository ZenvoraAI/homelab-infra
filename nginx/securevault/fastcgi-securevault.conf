# FastCGI to the Laravel API's PHP-FPM (Phase 6 T6, security plan review S5). Included by every
# location of docker/nginx/securevault-api.conf in securevault-framework; this is a verbatim copy
# for the api.valtou.com server block (only the upstream address differs, see $securevault_fpm).
#
# nginx serves no file from disk: every request runs public/index.php inside the FPM container,
# so nothing else (dotfiles, vendor/, storage/, a stray .php) can ever execute or be downloaded.
fastcgi_pass $securevault_fpm;
fastcgi_index index.php;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
# One trusted hop (TRUST_PROXY=1, App\Support\ClientIp): the forwarded-for the API sees is
# exactly the address this nginx saw ($remote_addr — the real client once real_ip has run
# against Cloudflare's ranges), never a client-supplied chain.
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
# httpoxy: a client "Proxy:" header must never become HTTP_PROXY inside PHP.
fastcgi_param HTTP_PROXY "";

# Above FPM's request_terminate_timeout (120 s, docker/fpm-pool.conf), so FPM ends a stuck
# request and its JSON error, not an nginx 504, reaches the client.
fastcgi_read_timeout 130s;
fastcgi_send_timeout 130s;
fastcgi_connect_timeout 5s;

# Header ownership: the API sets its own security headers and CORS; nginx adds none here
# (the homelab server block adds the HSTS / nosniff set and hides upstream copies).
fastcgi_hide_header X-Powered-By;

# homelab-infra only (the one difference from securevault-framework's copy): api.valtou.com
# adds nosniff / X-Frame-Options DENY / Referrer-Policy itself, so hide the API's copies.
# They must sit here, next to the hide above: a location with any fastcgi_hide_header of its
# own inherits none from the server block.
fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header Referrer-Policy;
