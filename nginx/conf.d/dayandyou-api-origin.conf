# api-origin-staging.dayandyou.com: the Day and You Laravel API behind CloudFront
# (static storefront, owner decision 2026-11-14). CloudFront reaches it through
# Cloudflare (proxied record); browsers never use this name.
#
# Step 1 (this file as committed first): port 80 only, so Certbot's webroot
# HTTP-01 challenge can issue the certificate. The 443 server block is added
# once /etc/letsencrypt/live/api-origin-staging.dayandyou.com exists: nginx
# refuses a config that names a missing certificate, which would take every
# site down on the next reload.

server {
    listen 80;
    server_name api-origin-staging.dayandyou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 404; }
}
