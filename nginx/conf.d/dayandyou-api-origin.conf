# api-origin-staging.dayandyou.com: the Day and You Laravel API behind CloudFront
# (static storefront, owner decision 2026-11-14). CloudFront reaches it through
# Cloudflare (proxied record); browsers never use this name.
#
# The 443 block names a certificate, and nginx refuses a config that names a
# missing one, which would take every site down on the next reload. So the
# port-80 block landed first on its own (Certbot's webroot HTTP-01 challenge),
# and this file gained the 443 block only once
# /etc/letsencrypt/live/api-origin-staging.dayandyou.com existed on the host.
#
# The http-level maps, log format and throttle zones are in
# 00-dayandyou-cloudfront.conf; README "Day and You API origin" has the trust
# chain and the origin-secret file.

server {
    listen 80;
    server_name api-origin-staging.dayandyou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 404; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-origin-staging.dayandyou.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/api-origin-staging.dayandyou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-origin-staging.dayandyou.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Only our distribution knows the secret; only then is CloudFront-Viewer-
    # Address (set by CloudFront, not the viewer) believed. Server-level rewrite
    # directives run before any location, so neither request reaches PHP.
    if ($dayandyou_origin_ok_staging != 1) { return 403; }
    if ($dayandyou_viewer_ip = "") { return 403; }

    # Where this environment's FPM socket volume is mounted (docker-compose.yml).
    set $dayandyou_api_sock_dir /run/dayandyou-api-fpm-staging;

    access_log /var/log/nginx/access.log dayandyou_api_cf;
    # `error`: nginx error lines carry the raw request line (query strings included), which the
    # access-log masking cannot reach. The token-carrying locations override it with /dev/null.
    error_log /var/log/nginx/error.log error;

    # Errors nginx answers itself use the API's {"error": "..."} shape, not nginx's HTML.
    error_page 413 = @payload_too_large;
    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @upstream_unavailable;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":"Payload too large"}';
    }
    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"Too many requests"}';
    }
    location @upstream_unavailable {
        default_type application/json;
        return 503 '{"error":"Service unavailable"}';
    }

    # API request bodies are small JSON; only the admin image upload (below) is large.
    client_max_body_size 256k;
    client_body_buffer_size 64k;

    # PHP would route /…/index.php/<path> as <path>, past every path-keyed rule here (pool
    # choice, body limits, log masking): never pass it on. Regex, so it beats the prefix below.
    location ~* /index\.php {
        default_type application/json;
        return 404 '{"error":"Not found"}';
    }

    # The payments pool: two reserved workers no login flood can pin. Exact matches beat every
    # regex and prefix location.
    location = /api/stripe-webhook {
        # Stripe event payloads stay well below this; the raw body is passed through unchanged.
        client_max_body_size 1m;
        set $dayandyou_api_fpm unix:$dayandyou_api_sock_dir/fpm-payments.sock;
        include /etc/nginx/dayandyou/fastcgi-dayandyou-api-cloudfront.conf;
    }
    location = /api/health {
        set $dayandyou_api_fpm unix:$dayandyou_api_sock_dir/fpm-payments.sock;
        include /etc/nginx/dayandyou/fastcgi-dayandyou-api-cloudfront.conf;
    }

    # Admin image upload: 5 MiB file (MAX_SIZE_BYTES) as multipart, PHP post_max_size 6M.
    location ~ ^/api/admin/products/[^/]+/images/?$ {
        client_max_body_size 6m;
        limit_req zone=dayandyou_cf_upload burst=10 nodelay;
        limit_conn dayandyou_cf_upload_conn 2;
        limit_req_status 429;
        limit_conn_status 429;
        set $dayandyou_api_fpm unix:$dayandyou_api_sock_dir/fpm.sock;
        include /etc/nginx/dayandyou/fastcgi-dayandyou-api-cloudfront.conf;
    }

    # Login, registration, reset: the routes that run argon2. Tokens travel in the body, but a
    # client may still put one in a query string, so no error log here either.
    location /api/auth/ {
        limit_req zone=dayandyou_cf_auth burst=5 nodelay;
        limit_conn dayandyou_cf_auth_conn 4;
        limit_req_status 429;
        limit_conn_status 429;
        error_log /dev/null;
        set $dayandyou_api_fpm unix:$dayandyou_api_sock_dir/fpm.sock;
        include /etc/nginx/dayandyou/fastcgi-dayandyou-api-cloudfront.conf;
    }

    # Checkout order tokens travel in the query string, and nginx's error log writes the raw
    # request line on every upstream failure, so this location logs no errors at all.
    location /api/checkout/ {
        error_log /dev/null;
        set $dayandyou_api_fpm unix:$dayandyou_api_sock_dir/fpm.sock;
        include /etc/nginx/dayandyou/fastcgi-dayandyou-api-cloudfront.conf;
    }

    location /api/ {
        set $dayandyou_api_fpm unix:$dayandyou_api_sock_dir/fpm.sock;
        include /etc/nginx/dayandyou/fastcgi-dayandyou-api-cloudfront.conf;
    }

    # CloudFront sends only /api/* here; nothing else exists on this origin.
    location / {
        default_type application/json;
        return 404 '{"error":"Not found"}';
    }
}
