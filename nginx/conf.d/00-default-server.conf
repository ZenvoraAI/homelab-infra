# Catch-all for any request whose Host (port 80) or SNI (port 443) matches no
# server_name below. Without it nginx falls back to the first server block for
# the port -- alphabetically admin.valtou.com.conf -- so a scan of the origin
# IP reached the admin panel, got the admin.valtou.com certificate (linking the
# IP to that name) and bypassed Cloudflare.
#
# 443: ssl_reject_handshake ends the TLS handshake before any certificate is
# sent, so no hostname leaks. Every real client sends SNI: Cloudflare to the
# origin, certbot, and zenvora-admin's certificate probe (servername set).
# 80: 444 closes the connection without a response. ACME HTTP-01 requests
# carry the real hostname and still match their own server block.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
    access_log off;

    return 444;
}
