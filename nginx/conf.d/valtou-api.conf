# SecureVault API: Laravel on PHP-FPM (unix socket in the securevault-fpm volume), not Express on :3000.
# Mirrors securevault-framework's server-laravel/docker/nginx/securevault-api.conf; the
# shared FastCGI params live in nginx/securevault/fastcgi-securevault.conf (copied verbatim).

# Access log without query strings, with the secrets that travel in a path masked (export
# download tokens, invite codes, share-link tokens). No bodies, no Authorization or Cookie.
map $uri $securevault_log_uri {
    "~*^(?<prefix>/(share|api/export/download|api/(family/)?invites)/)[^/]+(?<rest>.*)$" "${prefix}<secret>${rest}";
    default $uri;
}
log_format securevault '$remote_addr [$time_iso8601] "$request_method $securevault_log_uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

server {
    server_name api.valtou.com;
    server_tokens off;
    access_log /var/log/nginx/access.log securevault;
    # `error`, not `warn`: nginx error lines carry the raw request line (query string and
    # path secrets included). Treat this stream as sensitive.
    error_log /var/log/nginx/error.log error;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The API sends these too and add_header only appends: its copies are hidden in
    # nginx/securevault/fastcgi-securevault.conf, not here. A location that sets any
    # fastcgi_hide_header (the include does) inherits none from this level, so a
    # server-level hide is silently dropped. The API's HSTS passes through unchanged.

    # Never a TCP address: loopback is shared with every host-network service.
    set $securevault_fpm unix:/run/securevault-fpm/fpm.sock;

    # Errors nginx answers itself use the API's JSON envelope, not nginx's HTML.
    error_page 413 = @payload_too_large;
    error_page 502 503 504 = @upstream_unavailable;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"success":false,"error":"INTERNAL_ERROR","message":"An internal error occurred"}';
    }
    location @upstream_unavailable {
        default_type application/json;
        return 503 '{"success":false,"error":"INTERNAL_ERROR","message":"An internal error occurred"}';
    }

    # Each limit sits just above the API's own parser limit, so the API answers an oversized
    # body with its own 413 JSON and nginx still caps what reaches FPM.
    client_max_body_size 2m;
    client_body_buffer_size 128k;

    # PHP would route /index.php/<path> as <path>, past every path-keyed rule here (rate
    # limits, body limits, log masking): never serve it. First regex, so it always wins.
    location ~* ^/index\.php {
        default_type application/json;
        return 404 '{"success":false,"error":"NOT_FOUND","message":"Endpoint not found"}';
    }

    # The two endpoints that send email without a login, i.e. the ones usable as a free
    # mail relay. /api/contact notifies every admin, so one request is several messages.
    # Case-insensitive regexes: the API routes /API/auth/password-reset as well, and an
    # exact or case-sensitive match would be bypassed by changing case or adding a slash.
    location ~* ^/api/auth/password-reset {
        limit_req zone=email_ep burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/securevault/fastcgi-securevault.conf;
    }

    location ~* ^/api/contact/?$ {
        limit_req zone=email_ep burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/securevault/fastcgi-securevault.conf;
    }

    # 16 MB rotate-dek body.
    location ~ ^/api/vaults/[^/]+/rotate-dek/?$ {
        client_max_body_size 17m;
        include /etc/nginx/securevault/fastcgi-securevault.conf;
    }

    # 10 MB portable restore.
    location ~ ^/api/export/portable-restore/?$ {
        client_max_body_size 11m;
        include /etc/nginx/securevault/fastcgi-securevault.conf;
    }

    # Exports stream from a cursor: buffer them in nginx so a slow client never pins an FPM
    # worker, with a temp-file cap so one export cannot fill the disk. A plain prefix, never
    # `^~`: that would skip the regex locations above (the portable-restore limit).
    location /api/export/ {
        fastcgi_buffering on;
        fastcgi_buffers 16 64k;
        fastcgi_max_temp_file_size 256m;
        include /etc/nginx/securevault/fastcgi-securevault.conf;
    }

    location / {
        include /etc/nginx/securevault/fastcgi-securevault.conf;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.valtou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.valtou.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.valtou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}
