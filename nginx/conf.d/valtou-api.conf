server {
    server_name api.valtou.com;

    # Unverified whether securevault-api's own Express backend already sets
    # any of these three itself (e.g. via helmet()) -- if it does, add_header
    # only appends rather than replacing, which is exactly the duplicate-header
    # bug dayandyou.conf hit and had to revert (see tests/verify-admin-dayandyou-hardening.sh's
    # comment). After deploy, confirm with
    # `curl -sI https://api.valtou.com | grep -Ei 'x-frame-options|x-content-type-options|referrer-policy'`
    # -- each must appear exactly once, not twice with different values.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hoisted to server level so the rate-limited locations below inherit them
    # instead of repeating them. proxy_pass cannot be hoisted, so it stays in
    # each location.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # The two SecureVault endpoints that send email without a login, i.e. the
    # ones usable as a free mail relay. Everything else that sends (2FA events,
    # invites, access requests, MFA reminders) requires an authenticated
    # session and is not reachable by an anonymous loop.
    #
    # /api/contact is the worse of the two: it notifies *every* admin, so one
    # request produces several messages.
    location ^~ /api/auth/password-reset {
        limit_req zone=email_ep burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    # Regex, not `= /api/contact`: express runs with strict routing off, so
    # /api/contact/ reaches the same handler, and an exact-match location would
    # have been bypassed by appending one slash. Anchored so it cannot widen to
    # an unrelated /api/contact* path later.
    location ~ ^/api/contact/?$ {
        limit_req zone=email_ep burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.valtou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.valtou.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.valtou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}
