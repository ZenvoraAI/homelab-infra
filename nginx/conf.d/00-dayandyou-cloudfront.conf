# http-level definitions for the Day and You API origin behind CloudFront
# (dayandyou-api-origin.conf; README "Day and You API origin"). Runbook: private
# aws-infrastructure repo, docs/dayandyou-static-frontend.md, "Lightsail nginx".
#
# Behind CloudFront + Cloudflare, $remote_addr (after 00-cloudflare-realip.conf)
# is a CloudFront edge shared by many customers, not the visitor. CloudFront
# reports the visitor in CloudFront-Viewer-Address, which is believed only once
# the origin secret below proves the request came through our distribution.

# "198.51.100.10:46532" or an IPv6 address plus port (bracketed or not).
map $http_cloudfront_viewer_address $dayandyou_viewer_ip {
    "~^(?<addr>[0-9.]+):[0-9]+$"                 $addr;
    "~^\[?(?<addr>[0-9A-Fa-f:]+?)\]?:[0-9]+$"    $addr;
    default                                       "";
}

# One line per accepted value ("<secret>" 1;), outside git, root 0600 in
# /opt/secrets/dayandyou (mounted read-only). Two lines only during a rotation.
# Staging only: a prod map is added with the prod vhost, never before -- an
# include of a missing file stops nginx from starting.
# The 48-character key needs map_hash_bucket_size 128 (nginx.conf).
map $http_x_dayandyou_origin_secret $dayandyou_origin_ok_staging {
    default 0;
    include /etc/nginx/dayandyou-secrets/origin-secret-staging.map;
}

# Access log with token-carrying query strings masked (checkout order tokens,
# /api/auth/*), as in the API repo's docker/nginx/dayandyou-api.conf. Keyed on
# $uri, the normalised path: a $request_uri regex misses `//api/checkout/...` or
# `/api/%63heckout/...`, which nginx still routes to the same location.
map $is_args $dayandyou_log_args {
    "?"     "?<redacted>";
    default "";
}
map $uri $dayandyou_log_uri {
    "~*^/+(api/+(checkout|auth)/|reset-password)" "${uri}${dayandyou_log_args}";
    default $request_uri;
}
log_format dayandyou_api_cf '$dayandyou_viewer_ip [$time_iso8601] "$request_method $dayandyou_log_uri $server_protocol" '
                            '$status $body_bytes_sent $request_time';

# Edge throttles keyed on the viewer: cap login floods before the argon2 pool
# and upload floods before GD. The app keeps its own per-account/per-IP limits.
limit_req_zone  $dayandyou_viewer_ip zone=dayandyou_cf_auth:10m rate=10r/m;
limit_conn_zone $dayandyou_viewer_ip zone=dayandyou_cf_auth_conn:10m;
limit_req_zone  $dayandyou_viewer_ip zone=dayandyou_cf_upload:10m rate=20r/m;
limit_conn_zone $dayandyou_viewer_ip zone=dayandyou_cf_upload_conn:10m;
