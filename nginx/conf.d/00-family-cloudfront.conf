# http-level definitions for the family-media Laravel API behind the web CloudFront distribution's
# /api/* behaviour (family-api.conf; README "Family API on Laravel"; security-design 1.1, 1.2,
# 10.H1). Same pattern as 00-dayandyou-cloudfront.conf.
#
# Behind CloudFront + Cloudflare, $remote_addr (after 00-cloudflare-realip.conf) is a CloudFront
# edge shared by many visitors, not the visitor. CloudFront reports the visitor in
# CloudFront-Viewer-Address, which is believed only once the origin secret below proves the
# request came through our distribution.

# One line per accepted value ("<secret>" 1;), outside git, root 0600 in
# /opt/secrets/family-media-origin (mounted read-only into nginx only). Two lines only during a
# rotation. A missing file stops nginx from starting: create it before this file reaches the host.
# A 48-character key needs map_hash_bucket_size 128 (nginx.conf).
map $http_x_family_origin_secret $family_origin_ok {
    default 0;
    include /etc/nginx/family-secrets/origin-secret.map;
}

# The viewer's address, port stripped, and only when the secret matched; otherwise "" (the vhost
# answers 403). CloudFront sends "198.51.100.10:46532" for IPv4 and the IPv6 address followed by
# ":port", which is accepted with or without brackets. The app (App\Support\ClientIp) accepts only
# a bare, valid IP, so anything this lets through that is not one is refused there too.
map "$family_origin_ok|$http_cloudfront_viewer_address" $family_client_ip {
    "~^1\|(?<addr>[0-9.]+):[0-9]+$"                   $addr;
    "~^1\|\[?(?<addr>[0-9A-Fa-f:.]+?)\]?:[0-9]+$"      $addr;
    default                                             "";
}

# Access log keyed on the viewer, without query strings (signed-URL and token parameters), and with
# invitation codes (a bearer credential in the path) masked (security-design 10.L2). $uri is the
# normalised path, so `//api/invitations/...` or `%2F` spellings are masked too.
map $uri $family_log_uri {
    "~^/+api/+invitations/+code/" "/api/invitations/code/<redacted>";
    default                        $uri;
}
log_format family_api_cf '$family_client_ip [$time_iso8601] "$request_method $family_log_uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

# Throttles keyed on the viewer (security-design 10.H1), the same rates as the Express vhost's
# fam_auth / fam_general. New zone names on purpose: nginx refuses a reload that changes an
# existing zone's key, and reverting this switch brings fam_* back keyed on $binary_remote_addr.
limit_req_zone $family_client_ip zone=fam_cf_general:10m rate=240r/m;
limit_req_zone $family_client_ip zone=fam_cf_auth:10m rate=30r/m;
