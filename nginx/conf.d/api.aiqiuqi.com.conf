limit_req_zone $binary_remote_addr zone=mem_general:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=mem_auth:10m rate=30r/m;

server {
    server_name api.aiqiuqi.com;

    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The API sends its own copies of those three; the include hides them
    # (a location with any fastcgi_hide_header inherits none from here).

    # The Laravel memorial API (memorial-api-laravel) over FastCGI, on unix
    # sockets only. Rollback to Express while it still runs: revert this commit
    # (back to HTTP on unix:/run/memorial-api/http.sock) and reload.
    # MEMORIAL_HOST and MEMORIAL_CLIENT_IP come only from the include.
    #
    # The argon2 routes run in their own one-worker pool (~*: Express routes
    # paths case-insensitively, so /auth/LOGIN must not skip it). Both APIs route
    # /auth/login/ (any trailing slashes) to the login handler, so those
    # spellings must reach that pool and its limit too.
    location ~* ^/auth/(login|password)/*$ {
        limit_req zone=mem_auth burst=20 nodelay;
        set $memorial_api_fpm unix:/run/memorial-api-fpm/fpm-auth.sock;
        include /etc/nginx/memorial/fastcgi-memorial-api.conf;
    }
    location /auth/ {
        limit_req zone=mem_auth burst=20 nodelay;
        set $memorial_api_fpm unix:/run/memorial-api-fpm/fpm.sock;
        include /etc/nginx/memorial/fastcgi-memorial-api.conf;
    }
    location / {
        limit_req zone=mem_general burst=120 nodelay;
        set $memorial_api_fpm unix:/run/memorial-api-fpm/fpm.sock;
        include /etc/nginx/memorial/fastcgi-memorial-api.conf;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.aiqiuqi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aiqiuqi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.aiqiuqi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}
