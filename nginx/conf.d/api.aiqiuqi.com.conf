limit_req_zone $binary_remote_addr zone=mem_general:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=mem_auth:10m rate=30r/m;

server {
    server_name api.aiqiuqi.com;

    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    location /auth/ { limit_req zone=mem_auth burst=20 nodelay; proxy_pass http://127.0.0.1:3001; }
    location /     { limit_req zone=mem_general burst=120 nodelay; proxy_pass http://127.0.0.1:3001; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.aiqiuqi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aiqiuqi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.aiqiuqi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}
