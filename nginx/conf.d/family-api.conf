limit_req_zone $binary_remote_addr zone=fam_general:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=fam_auth:10m rate=30r/m;

server {
    server_name api.family.valtou.com;

    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;

    location /auth/ { limit_req zone=fam_auth burst=20 nodelay; proxy_pass http://127.0.0.1:4000; }
    location /     { limit_req zone=fam_general burst=120 nodelay; proxy_pass http://127.0.0.1:4000; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.family.valtou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.family.valtou.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.family.valtou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

# New one-level hostname for family-media's API, so it can eventually sit behind
# Cloudflare's free-tier Universal SSL (which covers only the root domain plus one
# level of subdomain -- api.family.valtou.com is two levels and can't). Port-80-only
# for now: this stage exists solely to let certbot's HTTP-01 challenge reach this
# hostname. The 443 block and ssl_certificate lines get added once that cert exists.
server {
    listen 80;
    server_name family-api.valtou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}
