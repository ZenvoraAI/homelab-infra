limit_req_zone $binary_remote_addr zone=fam_general:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=fam_auth:10m rate=30r/m;

# family-media's API. A one-level hostname so it sits behind Cloudflare's free-tier
# Universal SSL (root domain plus one level only). The old two-level, DNS-only
# api.family.valtou.com was retired on 2026-11-01 so 80/443 can be limited to
# Cloudflare's ranges; the default server now answers it with 444.
server {
    server_name family-api.valtou.com;

    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The upstream (helmet) sends these too; add_header only appends, so hide
    # its copies or every response carries each header twice.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API may key its login lockout on CF-Connecting-IP (CLIENT_IP_HEADER).
    # Never pass the client's own copy: a host-network co-tenant can reach this
    # server over loopback and send any value. $remote_addr is that header's
    # value only when the peer is Cloudflare (00-cloudflare-realip.conf).
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;

    # The API listens only on its unix socket (docker-compose.yml, family-api-sock).
    location /auth/ { limit_req zone=fam_auth burst=20 nodelay; proxy_pass http://unix:/run/family-api/http.sock:; }
    location /     { limit_req zone=fam_general burst=120 nodelay; proxy_pass http://unix:/run/family-api/http.sock:; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/family-api.valtou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family-api.valtou.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name family-api.valtou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}
