# family-api.valtou.com: since the Laravel cutover, only the CloudFront origin of the web
# distribution's /api/* behaviour (https://family.valtou.com/api/* -> CloudFront -> Cloudflare ->
# here; README "Family API on Laravel", docs/family-api-laravel-cutover.md). Browsers no longer
# call this name. Nothing routes to the Express API (service api) any more; reverting this commit
# and reloading nginx restores the Express vhost, which needs that service back (see the runbook,
# docs/family-api-laravel-cutover.md, "Rollback").
#
# A one-level hostname so it sits behind Cloudflare's free-tier Universal SSL (root domain plus one
# level only); 80/443 accept only Cloudflare's ranges. The http-level maps, log format and throttle
# zones are in 00-family-cloudfront.conf.
server {
    server_name family-api.valtou.com;

    # Only our distribution knows the secret; only then is CloudFront-Viewer-Address (set by
    # CloudFront, not the viewer) believed. Server-level rewrite directives run before any location
    # and before limit_req, so neither request reaches PHP or a throttle bucket. Every direct request
    # -- the old Express paths included -- ends here with 403.
    if ($family_origin_ok != 1) { return 403; }
    if ($family_client_ip = "") { return 403; }

    access_log /var/log/nginx/access.log family_api_cf;
    # `error`: nginx error lines carry the raw request line, which the access-log masking cannot
    # reach. The invitation-code location logs no errors at all.
    error_log /var/log/nginx/error.log error;

    # Today's limits (Express vhost); PHP takes at most 1 MB of JSON (post_max_size), media goes to
    # S3 by presigned POST.
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The API sends its own copies of those three; the include hides them
    # (a location with any fastcgi_hide_header inherits none from here).

    # Errors nginx answers itself use the API's {"data":null,"error":"..."} envelope.
    error_page 413 = @payload_too_large;
    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @upstream_unavailable;
    limit_req_status 429;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"data":null,"error":"Payload too large"}';
    }
    location @too_many_requests {
        default_type application/json;
        return 429 '{"data":null,"error":"Too many requests"}';
    }
    location @upstream_unavailable {
        default_type application/json;
        return 503 '{"data":null,"error":"Service unavailable"}';
    }

    # The Laravel family API (family-api-laravel) over FastCGI, on unix sockets only.
    # FAMILY_CLIENT_IP comes only from the include ($family_client_ip, the validated viewer).

    # PHP would route /…/index.php/<path> as <path>, past every path-keyed rule here (pool choice,
    # throttles, log masking): never pass it on (security-design 10.L4). Regex, so it beats the
    # /api/ prefixes below.
    location ~* /index\.php {
        default_type application/json;
        return 404 '{"data":null,"error":"Not found"}';
    }

    # Metrics stay off the public /api/* behaviour (security-design 10.L1); the token check in the
    # app is the second layer. ^~ so no regex location can take it.
    location ^~ /api/metrics {
        default_type application/json;
        return 404 '{"data":null,"error":"Not found"}';
    }

    # The argon2 routes run in the one-worker auth pool (family-media-api docker/nginx/test.conf):
    # a login flood queues there instead of pinning the main pool. Trailing slashes included;
    # ~* so a case variant cannot skip the pool's throttle.
    location ~* ^/api/auth/(login|change-password)/*$ {
        limit_req zone=fam_cf_auth burst=20 nodelay;
        set $family_api_fpm unix:/run/family-api-fpm/fpm-auth.sock;
        include /etc/nginx/family/fastcgi-family-api.conf;
    }
    location /api/auth/ {
        limit_req zone=fam_cf_auth burst=20 nodelay;
        set $family_api_fpm unix:/run/family-api-fpm/fpm.sock;
        include /etc/nginx/family/fastcgi-family-api.conf;
    }
    # The invitation code is a bearer credential in the path: no error log here.
    location /api/invitations/code/ {
        limit_req zone=fam_cf_general burst=120 nodelay;
        error_log /dev/null;
        set $family_api_fpm unix:/run/family-api-fpm/fpm.sock;
        include /etc/nginx/family/fastcgi-family-api.conf;
    }
    location /api/ {
        limit_req zone=fam_cf_general burst=120 nodelay;
        set $family_api_fpm unix:/run/family-api-fpm/fpm.sock;
        include /etc/nginx/family/fastcgi-family-api.conf;
    }

    # CloudFront sends only /api/* here; the Express root paths (/auth/, /media, ...) are closed.
    location / {
        default_type application/json;
        return 404 '{"data":null,"error":"Not found"}';
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/family-api.valtou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family-api.valtou.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name family-api.valtou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}
