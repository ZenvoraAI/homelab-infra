# FastCGI to the Laravel family-media API's PHP-FPM (docker-compose.yml family-api-laravel). Copied
# from ZenvoraAI/family-media-api docker/nginx/fastcgi-family-api.conf (9b023ec), which its smoke test
# runs; keep the two in step. One addition, marked "homelab:" below. Included by every
# family-api.valtou.com /api/ location; the location sets $family_api_fpm to one of the pool sockets
# first.
#
# nginx serves no file from disk: every request runs public/index.php inside the FPM container, so
# nothing else (dotfiles, vendor/, storage/, .env, a stray .php) can execute or be downloaded.
fastcgi_pass $family_api_fpm;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
fastcgi_param DOCUMENT_URI /index.php;
# The client address for every throttle key (App\Support\ClientIp). A non-HTTP_ parameter, so no
# request header can set it. $family_client_ip is the CloudFront viewer address with its port
# stripped, set only when the origin secret matched (conf.d/00-family-cloudfront.conf); the vhost
# refuses the request with 403 before this runs when it is empty.
fastcgi_param FAMILY_CLIENT_IP $family_client_ip;
# Headers that must never reach PHP (security-design 10.H3).
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_param HTTP_X_REAL_IP "";
fastcgi_param HTTP_CF_CONNECTING_IP "";
fastcgi_param HTTP_CLOUDFRONT_VIEWER_ADDRESS "";
fastcgi_param HTTP_X_FAMILY_ORIGIN_SECRET "";
fastcgi_param HTTPS $https if_not_empty;
# httpoxy: a client "Proxy:" header must never become HTTP_PROXY inside PHP.
fastcgi_param HTTP_PROXY "";

# Above FPM's request_terminate_timeout (main 60 s, auth 30 s), so FPM ends a stuck request and the
# client gets the app's JSON error, not an nginx 504.
fastcgi_read_timeout 70s;
fastcgi_send_timeout 70s;
fastcgi_connect_timeout 5s;

fastcgi_hide_header X-Powered-By;

# homelab: the vhost adds these three itself and the API sends its own copies; add_header only
# appends. A location that sets any fastcgi_hide_header inherits none from its server block, so
# they live here (tests/verify-no-duplicate-security-headers.sh), as in fastcgi-memorial-api.conf.
fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header Referrer-Policy;
