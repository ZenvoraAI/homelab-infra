# FastCGI to the Laravel memorial API's PHP-FPM (docker-compose.yml memorial-api-laravel). Copied
# from ZenvoraAI/memorial-api docker/nginx/fastcgi-memorial-api.conf, which its smoke test runs; keep
# the two in step. Included by every api.aiqiuqi.com location; the location sets $memorial_api_fpm to
# one of the pool sockets first.
#
# nginx serves no file from disk: every request runs public/index.php inside the FPM container, so
# nothing else (dotfiles, vendor/, storage/, .env, a stray .php) can execute or be downloaded.
fastcgi_pass $memorial_api_fpm;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
fastcgi_param DOCUMENT_URI /index.php;
# The tenant key (App\Http\Middleware\ResolveTenant): nginx's $host — lower-cased, port removed —
# exactly what Express receives via `proxy_set_header Host $host`. A non-HTTP_ parameter, so no
# request header can set it.
fastcgi_param MEMORIAL_HOST $host;
# The client address for every throttle key (App\Support\ClientIp): no X-Forwarded-For is passed and
# the app trusts none. $remote_addr must be the real client (no userland-proxy NAT in front).
fastcgi_param MEMORIAL_CLIENT_IP $remote_addr;
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_param HTTP_X_REAL_IP "";
# TLS terminates in this nginx.
fastcgi_param HTTPS $https if_not_empty;
# httpoxy: a client "Proxy:" header must never become HTTP_PROXY inside PHP.
fastcgi_param HTTP_PROXY "";

# Above FPM's request_terminate_timeout (main 60 s, auth 30 s), so FPM ends a stuck request and the
# client gets the app's JSON error, not an nginx 504.
fastcgi_read_timeout 70s;
fastcgi_send_timeout 70s;
fastcgi_connect_timeout 5s;

fastcgi_hide_header X-Powered-By;

# The vhost adds these three itself; the API sends its own copies (Helmet's values), and add_header
# only appends. A location that sets any fastcgi_hide_header inherits none from its server block, so
# they live here (tests/verify-no-duplicate-security-headers.sh).
fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header Referrer-Policy;
