# Allow-list in front of docker-socket-proxy (see docker-compose.yml).
#
# tecnativa/docker-socket-proxy's finest switch, CONTAINERS=1, opens the whole
# GET /containers/* surface: inspect (every container's Config.Env, i.e. every
# secret on the host) and archive (any file inside any container, e.g.
# family-media's mounted .env). zenvora-admin calls exactly one endpoint,
# GET /containers/json?all=true (src/deployment/dockerProxy.ts), so this
# filter forwards that one path and refuses everything else.
#
# Not mounted into the public nginx: this file lives outside nginx/conf.d on
# purpose, so `include conf.d/*.conf` never picks it up.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    server_tokens off;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Docker's embedded DNS. The upstream name goes through a variable so it
    # is re-resolved at request time: a static upstream would pin the proxy's
    # IP at startup and break silently once docker-socket-proxy is recreated
    # on its own (new IP), and would refuse to start if it were not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 2375;

        # Exact match on nginx's normalised URI, and the upstream request path
        # is a fixed string rather than the client's raw URI -- so no
        # percent-encoding or dot-segment trick can turn an allowed request
        # into /containers/<id>/json or /containers/<id>/archive upstream.
        # Only the query string is passed through (list filters such as all=).
        location = /containers/json {
            limit_except GET {
                deny all;
            }
            # Only reachable on the internal docker-socket-net, under an alias
            # distinct from this filter's own alias on docker-proxy-net.
            set $docker_socket_upstream docker-socket-upstream:2375;
            proxy_pass http://$docker_socket_upstream/containers/json$is_args$args;
        }

        location / {
            return 403;
        }
    }
}
